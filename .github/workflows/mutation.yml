name: Mutation testing

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - src/**
      - tests/**
      - stryker.config.json
      - vitest.config.ts
      - package.json
      - package-lock.json

jobs:
  mutation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
